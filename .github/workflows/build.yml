# Builds an unsigned Digistban.ipa on every push and publishes it as a release.
# Sideloadly (or AltStore) signs it with your Apple ID when installing it.
name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          # The newest Xcode 26: built with the iOS 26 SDK, the app gets the Liquid Glass design.
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          brew install xcodegen

      - name: Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Digistban.xcodeproj \
            -scheme Digistban \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Digistban.app

      - name: Package
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Digistban.app Payload/
          zip -qry Digistban.ipa Payload
          ls -lh Digistban.ipa

      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Digistban-ipa
          path: Digistban.ipa

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^\s+MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"(.*)"/\1/')
          gh release create "v$VERSION-${{ github.run_number }}" Digistban.ipa \
            --title "Digistban $VERSION (${{ github.run_number }})" \
            --notes "IPA non signée, à installer avec Sideloadly. Commit ${GITHUB_SHA::7}."
