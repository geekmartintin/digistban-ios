# XcodeGen spec: `xcodegen generate` writes Digistban.xcodeproj (done by CI, see .github/workflows/build.yml).
name: Digistban
options:
  bundleIdPrefix: com.digistban
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Unsigned build: CI signs it ad hoc with the entitlements, then Sideloadly
    # (or AltStore) signs it with your Apple ID when installing.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Digistban:
    type: application
    platform: iOS
    sources:
      - path: Digistban
        excludes:
          - Info.plist
          - Digistban.entitlements
      - path: Shared
    dependencies:
      - target: DigistbanWidgets
      - target: DigistbanShare
    settings:
      base:
        PRODUCT_NAME: Digistban
        PRODUCT_BUNDLE_IDENTIFIER: com.digistban.app
        # Shared/TransferIntents.swift runs app code only in the app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIGISTBAN_APP
        INFOPLIST_FILE: Digistban/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: "NO"

  # Live Activity of a transfer being sent (Lock Screen, Dynamic Island).
  DigistbanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: DigistbanWidgets
        excludes:
          - Info.plist
      - path: Shared/UploadActivity.swift
      - path: Shared/TransferIntents.swift
    settings:
      base:
        PRODUCT_NAME: DigistbanWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.digistban.app.widgets
        INFOPLIST_FILE: DigistbanWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"

  # Simulator tests (deploy/test-ios.sh): code field, Live Activity buttons, frame timing.
  DigistbanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DigistbanUITests
    dependencies:
      - target: Digistban
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.digistban.app.uitests
        TEST_TARGET_NAME: Digistban
        GENERATE_INFOPLIST_FILE: "YES"

  # "Digistban" in the share sheet of Photos, Files and other apps.
  DigistbanShare:
    type: app-extension
    platform: iOS
    sources:
      - path: DigistbanShare
        excludes:
          - Info.plist
          - DigistbanShare.entitlements
      - path: Shared/AppGroup.swift
    settings:
      base:
        PRODUCT_NAME: DigistbanShare
        PRODUCT_BUNDLE_IDENTIFIER: com.digistban.app.share
        INFOPLIST_FILE: DigistbanShare/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"

schemes:
  # The app (release builds, .github/workflows/build.yml).
  Digistban:
    build:
      targets:
        Digistban: all
  # The app and its UI tests in the simulator (.github/workflows/simulator.yml).
  DigistbanTests:
    build:
      targets:
        Digistban: all
        DigistbanUITests: [test]
    test:
      config: Debug
      targets:
        - DigistbanUITests
